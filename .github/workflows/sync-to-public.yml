name: Sync to public repo

# Pushes this private repo's `main` (and tags) to the public mirror.
# Replaces the GitLab `force_push_to_github` stage / copy_and_tag_to_github.sh.
#
# The two repos share history (the public repo branched at 9b87a90), so this is
# a fast-forward push — NOT a force push. If the public repo has diverged the
# push fails loudly rather than destroying commits there.
#
# Manual only by design: every run makes private commits permanently public.
# To auto-sync on every push to main, uncomment the `push:` trigger below.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to create at HEAD and push (e.g. v1.6). This is what triggers the release build in the public repo."
        required: false
        default: ""
      dry_run:
        description: "Show what would be pushed without pushing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write # to push the new tag back to this private repo

env:
  PUB_REPO: drai-inn/agdr-validator-pub

jobs:
  sync:
    name: Push main and tags to the public mirror
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a shallow clone cannot be pushed to another repo
          fetch-tags: true
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add public remote
        env:
          PUB_TOKEN: ${{ secrets.PUB_REPO_TOKEN }}
        run: |
          if [ -z "$PUB_TOKEN" ]; then
            echo "::error::Secret PUB_REPO_TOKEN is not set. See .github/workflows/sync-to-public.yml for setup."
            exit 1
          fi
          git remote add pub "https://x-access-token:${PUB_TOKEN}@github.com/${PUB_REPO}.git"
          # --no-tags is required, not cosmetic: a tag intentionally points at
          # different commits in the two repos (real commit here, strip commit
          # there), so fetching the mirror's tags would be refused as a clobber.
          # Only pub/main is ever needed below.
          git fetch --no-tags pub main

      - name: Show what would be published
        run: |
          {
            echo "## Sync preview"
            echo
            echo "\`${GITHUB_REPOSITORY}@$(git rev-parse --short HEAD)\` → \`${PUB_REPO}@main\`"
            echo
            echo "### Commits that would become public"
            echo '```'
            git log --oneline pub/main..HEAD || echo "(none — already in sync)"
            echo '```'
            echo "### Files changed"
            echo '```'
            git diff --stat pub/main..HEAD || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the public repo has not diverged
        run: |
          PUB_TIP=$(git rev-parse pub/main)
          # pub/main is either a plain mirror of a commit we have, or a strip
          # commit (see below) whose parent we have. Anything else is divergence.
          if git merge-base --is-ancestor "$PUB_TIP" HEAD; then exit 0; fi
          if git merge-base --is-ancestor "${PUB_TIP}^" HEAD 2>/dev/null; then exit 0; fi
          echo "::error::${PUB_REPO}@main has commits that are not in this repo's HEAD."
          echo "::error::Reconcile manually — this workflow will not clobber them."
          exit 1

      # The public repo is a mirror of main, so anything on main becomes public.
      # Internal-only workflows are removed on a commit layered on top, rather
      # than being pushed and then hidden.
      - name: Strip internal-only files
        run: |
          echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -f .github/workflows/sync-to-public.yml
          git checkout -B mirror
          if git diff --quiet HEAD; then
            echo "Nothing to strip."
          else
            git add -A
            git commit -m "chore: strip internal-only workflows from the public mirror"
          fi
          git log --oneline -1

      - name: Push main
        if: ${{ !inputs.dry_run }}
        run: |
          # Force is required because of the strip commit, but --force-with-lease
          # pins the expected remote tip so a concurrent push is never clobbered.
          git push pub "mirror:refs/heads/main" \
            --force-with-lease=refs/heads/main:"$(git rev-parse pub/main)"

      - name: Create and push tag
        if: ${{ inputs.tag != '' && !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Private repo: tag the real commit, so this repo stays authoritative.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists here; leaving it where it is."
          else
            git tag -a "${TAG}" -m "Release ${TAG}" "${ORIG_SHA}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
          fi
          # Public repo: tag the stripped mirror commit instead. Same name, and
          # the same tree minus the internal workflow. A local scratch ref keeps
          # the private tag above untouched.
          git tag -f "__pub/${TAG}" mirror
          git push --force pub "refs/tags/__pub/${TAG}:refs/tags/${TAG}"
          echo "Pushed tag ${TAG} to ${PUB_REPO} — the release build starts there now."

      - name: Summarise
        if: always()
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run — nothing was pushed.**"
            else
              echo "### Result"
              echo "- Pushed to [${PUB_REPO}](https://github.com/${PUB_REPO})"
              if [ -n "${TAG}" ]; then
                echo "- Tagged \`${TAG}\` — the public repo's *Build executables* workflow is now building the release."
                echo "- Public downloads will appear at https://github.com/${PUB_REPO}/releases/tag/${TAG}"
              else
                echo "- No tag given, so no release was triggered. Re-run with a \`tag\` input to publish executables."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
