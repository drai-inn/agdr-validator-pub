name: Build executables

# Ported from .gitlab-ci.yml (build:windows / build:macos).
# Both GitLab jobs were `when: manual`, so manual dispatch is the primary trigger.
# Pushing a tag additionally publishes the executables as public release assets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used to build the executables"
        required: false
        default: "3.11"
      retention-days:
        description: "How long to keep the built artifacts (GitLab: expire_in 1 day)"
        required: false
        default: "1"
      release_tag:
        description: "Publish a public release under this tag (e.g. v1.6). Leave empty to build artifacts only."
        required: false
        default: ""

permissions:
  contents: read

env:
  APP_NAME: agdrvalidator1_6
  DICTIONARY: gen3.nesi_2025_09_01.json

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    # GitLab: allow_failure: true
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        working-directory: src/agdrvalidator
        run: |
          pyinstaller --onefile `
            --add-data "data/dictionaries/${env:DICTIONARY};agdrvalidator/data/dictionaries" `
            --name "${env:APP_NAME}-win" `
            __main__.py

      - name: Stage executable at repository root
        run: |
          Copy-Item "src/agdrvalidator/dist/${env:APP_NAME}-win.exe" "${env:APP_NAME}-win.exe"
          Get-ChildItem

      - name: Upload executable
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win
          path: ${{ env.APP_NAME }}-win.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || '1' }}

      # The equivalent smoke test was commented out in .gitlab-ci.yml.
      # - name: Smoke test
      #   continue-on-error: true
      #   run: ./${env:APP_NAME}-win.exe -t -p 00103 -s files/agdrtemplate_2025_03_20.xlsx -v

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows executable"
            echo
            if [ -n "${{ steps.upload.outputs.artifact-url }}" ]; then
              echo "| Artifact | Size | Download |"
              echo "| --- | --- | --- |"
              echo "| \`${APP_NAME}-win.exe\` | $(du -h "${APP_NAME}-win.exe" | cut -f1) | [Download](${{ steps.upload.outputs.artifact-url }}) |"
              echo
              echo "Expires in ${{ inputs.retention-days || '1' }} day(s). **Downloading an artifact requires signing in to GitHub** — for public, anonymous downloads use the release assets instead."
            else
              echo ":x: The build failed before an artifact was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    name: Build macOS executable
    runs-on: macos-14
    # GitLab: allow_failure: true
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        working-directory: src/agdrvalidator
        run: |
          pyinstaller --onefile \
            --add-data "data/dictionaries/${DICTIONARY}:agdrvalidator/data/dictionaries" \
            --name "${APP_NAME}-mac" \
            __main__.py
          ls -l dist
          xattr -dr com.apple.quarantine "./dist/${APP_NAME}-mac"

      - name: Stage executable at repository root
        run: |
          cp "src/agdrvalidator/dist/${APP_NAME}-mac" "${APP_NAME}-mac"
          chmod +x "${APP_NAME}-mac"
          ls -l

      - name: Upload executable
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-mac
          path: ${{ env.APP_NAME }}-mac
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || '1' }}

      - name: Smoke test
        continue-on-error: true
        run: ./${APP_NAME}-mac -t -p 00103 -s files/agdrtemplate_2025_03_20.xlsx -v

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## macOS executable"
            echo
            if [ -n "${{ steps.upload.outputs.artifact-url }}" ]; then
              echo "| Artifact | Size | Download |"
              echo "| --- | --- | --- |"
              echo "| \`${APP_NAME}-mac\` | $(du -h "${APP_NAME}-mac" | cut -f1) | [Download](${{ steps.upload.outputs.artifact-url }}) |"
              echo
              echo "Built on \`macos-14\` (arm64). Expires in ${{ inputs.retention-days || '1' }} day(s)."
              echo "After downloading, run \`chmod +x ${APP_NAME}-mac\` — the execute bit is not preserved inside the artifact zip."
            else
              echo ":x: The build failed before an artifact was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the executables as release assets. On a PUBLIC repo these are
  # downloadable by anyone with no GitHub account and no token — unlike Actions
  # artifacts above, which always require an authenticated user.
  release:
    name: Publish release assets
    needs: [build-windows, build-macos]
    # Runs on a tag push, or on a manual dispatch that supplied a release_tag.
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lR dist

      # Release notes are hand-written and version-controlled under
      # files/release_notes/. Tag v1.6 -> files/release_notes/1_6.md.
      # The YAML frontmatter is stripped; a Downloads section is appended.
      - name: Assemble release notes
        id: notes
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE="files/release_notes/${VERSION//./_}.md"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          if [ -f "$NOTES_FILE" ]; then
            echo "Using $NOTES_FILE"
            # drop leading --- ... --- frontmatter, keep everything after it
            awk 'NR==1 && /^---[[:space:]]*$/ {fm=1; next}
                 fm==1 && /^---[[:space:]]*$/ {fm=2; next}
                 fm!=1' "$NOTES_FILE" > body.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release notes found at ${NOTES_FILE}. Falling back to auto-generated notes from commit history."
            : > body.md
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows | [${APP_NAME}-win.exe](${BASE}/${APP_NAME}-win.exe) |"
            echo "| macOS (Apple silicon) | [${APP_NAME}-mac](${BASE}/${APP_NAME}-mac) |"
            echo
            echo "On macOS the binary is unsigned, so after downloading run:"
            echo '```bash'
            echo "chmod +x ${APP_NAME}-mac && xattr -d com.apple.quarantine ${APP_NAME}-mac"
            echo '```'
          } >> body.md

          echo "--- final release body ---"
          cat body.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # --generate-notes only as a fallback when no notes file exists.
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            NOTES_ARGS=(--notes-file body.md)
          else
            NOTES_ARGS=(--notes-file body.md --generate-notes)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # re-running a release refreshes its notes rather than duplicating it
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "AGDR Validator ${TAG}" "${NOTES_ARGS[@]}"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Write job summary
        if: always()
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          {
            echo "## Public downloads — \`${TAG}\`"
            echo
            echo "| Platform | Direct link (this tag) | Always-latest link |"
            echo "| --- | --- | --- |"
            echo "| Windows | [${APP_NAME}-win.exe](${BASE}/download/${TAG}/${APP_NAME}-win.exe) | \`${BASE}/latest/download/${APP_NAME}-win.exe\` |"
            echo "| macOS | [${APP_NAME}-mac](${BASE}/download/${TAG}/${APP_NAME}-mac) | \`${BASE}/latest/download/${APP_NAME}-mac\` |"
            echo
            echo "[Release page](${BASE}/tag/${TAG})"
            echo
            echo "> These links work without a GitHub account **only while the repository is public**."
            echo "> macOS users: \`chmod +x ${APP_NAME}-mac && xattr -d com.apple.quarantine ${APP_NAME}-mac\` (the binary is unsigned)."
          } >> "$GITHUB_STEP_SUMMARY"
