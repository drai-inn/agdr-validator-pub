stages:
  - force_push_to_github
  - build
  - package

variables:
  GITHUB_REPO_URL: "https://github.com/nesi/agdr-validator.git"
  GIT_TAG: "v1.3"
  PYTHON_VERSION: "3.9"  
  APP_NAME: "agdrvalidator1_6"       

force_push_to_github:
  stage: force_push_to_github
  script:
    - chmod +x copy_and_tag_to_github.sh
    - ./copy_and_tag_to_github.sh $GITHUB_REPO_URL $GIT_TAG
  when: manual

build:windows:
  stage: build
  image: python:${PYTHON_VERSION}-windowsservercore
  tags:
    - saas-windows-medium-amd64
  script:
    - cd src/agdrvalidator
    - pip install -r requirements.txt
    - pip install pyinstaller
    - pyinstaller --onefile --add-data=data/dictionaries/gen3.nesi_2025_09_01.json:agdrvalidator/data/dictionaries  --name ${APP_NAME}-win __main__.py
    - cd ..
    - cd ..
    - cp src/agdrvalidator/dist/${APP_NAME}-win.exe  ${APP_NAME}-win.exe
    - dir
    - ./${APP_NAME}-win -t -p 00103 -s files/agdrtemplate_2025_03_20.xlsx -v

  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  when: manual
  allow_failure: true

# Build for macOS (Manual)
build:macos:
  stage: build
  tags:
    - saas-macos-large-m2pro
  script:
    - cd src/agdrvalidator
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install pyinstaller
    - pip install -r requirements.txt
    - pyinstaller --onefile --add-data=data/dictionaries/gen3.nesi_2025_09_01.json:agdrvalidator/data/dictionaries  --name ${APP_NAME}-mac __main__.py
    
    - ls dist
    - xattr -dr com.apple.quarantine ./dist/${APP_NAME}-mac
    - cd ..
    - cd ..
    - cp src/agdrvalidator/dist/${APP_NAME}-mac  ${APP_NAME}-mac
    - ls
    - ./${APP_NAME}-mac -t -p 00103 -s files/agdrtemplate_2025_03_20.xlsx -v
  artifacts:
    paths:
      - ${APP_NAME}-mac
    expire_in: 1 day
  when: manual
  allow_failure: true

# Build for Linux (Manual)
build:linux:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  script:
    - cd src/agdrvalidator
    - apt-get update && apt-get install -y binutils
    - pip install pyinstaller
    - pip install -r requirements.txt
    - pyinstaller --onefile --add-data=data/dictionaries/gen3.nesi_2025_09_01.json:agdrvalidator/data/dictionaries  --name ${APP_NAME}-linux __main__.py
    - cd ..
    - cd ..
    - cp src/agdrvalidator/dist/${APP_NAME}-linux  ${APP_NAME}-linux
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  when: manual
  allow_failure: true

